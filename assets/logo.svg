<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 140" fill="none" class="brand-logo-svg">
  <!-- Steam lines -->
  <path d="M72 26c0-6 4-10 2-16M84 28c0-8 6-12 3-18M96 26c0-6 4-10 2-16" stroke="#F5C253" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="1 3"/>
  <!-- Cup with GT Monogram -->
  <path d="M50 38h64c0 0 2 28-12 38-8 6-18 8-20 8s-12-2-20-8C50 66 50 38 50 38z" fill="url(#cupGrad)" stroke="#F5C253" stroke-width="2"/>
  <!-- Handle -->
  <path d="M114 46c8 0 14 5 14 12s-6 12-14 12" stroke="#F5C253" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Saucer -->
  <path d="M42 86c0-2 16-3 40-3s40 1 40 3-16 3-40 3-40-1-40-3z" fill="#E5A93C"/>
  <!-- GT letters inside cup -->
  <text x="82" y="62" text-anchor="middle" fill="#0A1124" font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="20" letter-spacing="1">GT</text>
  
  <!-- Typography -->
  <!-- गपshup -->
  <text x="145" y="62" font-family="'Playfair Display', 'Cormorant Garamond', 'Noto Sans Devanagari', serif" font-weight="800" font-size="34" fill="#FFFFFF" letter-spacing="0.5">
    <tspan fill="#F5C253">गप</tspan><tspan fill="#FFFFFF">shup</tspan>
  </text>
  
  <!-- ठिकाना -->
  <text x="146" y="96" font-family="'Noto Sans Devanagari', 'Outfit', sans-serif" font-weight="700" font-size="28" fill="#F5C253" letter-spacing="1.5">
    ठिकाना
  </text>
  
  <!-- Cafe & Restaurant & 24/7 -->
  <text x="147" y="118" font-family="'Outfit', sans-serif" font-weight="500" font-size="11" fill="#94A3B8" letter-spacing="3.5" text-transform="uppercase">
    CAFE &amp; RESTAURANT <tspan fill="#22C55E">● 24/7</tspan>
  </text>

  <defs>
    <linearGradient id="cupGrad" x1="50" y1="38" x2="114" y2="84" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FDE047"/>
      <stop offset="1" stop-color="#E5A93C"/>
    </linearGradient>
  </defs>
</svg>
